name = "zonefall-server"
main = "src/index.ts"
compatibility_date = "2025-10-01"
workers_dev = true
preview_urls = false

[assets]
directory = "../dist"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

# rankings: one global instance (best survival time and wins per name)
[[durable_objects.bindings]]
name = "RANKING"
class_name = "Ranking"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Lobby"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Ranking"]

[[ratelimits]]
name = "JOIN_LIMIT"
namespace_id = "7301"
simple = { limit = 15, period = 60 }

# join attempts per IPv6 /48 (four /64s' worth, checked after the /64 key)
[[ratelimits]]
name = "JOIN_LIMIT48"
namespace_id = "7302"
simple = { limit = 60, period = 60 }

# in-band "too many attempts" refusals per network; the rest get plain 429s
[[ratelimits]]
name = "REFUSE_LIMIT"
namespace_id = "7303"
simple = { limit = 3, period = 60 }

# ... and per IPv6 /48 (four /64s' worth)
[[ratelimits]]
name = "REFUSE_LIMIT48"
namespace_id = "7304"
simple = { limit = 12, period = 60 }

# self-reported solo results (POST /api/rank/solo) per network
[[ratelimits]]
name = "RANK_POST_LIMIT"
namespace_id = "7305"
simple = { limit = 6, period = 60 }

# ranking reads (GET /api/rank) per network
[[ratelimits]]
name = "RANK_READ_LIMIT"
namespace_id = "7306"
simple = { limit = 60, period = 60 }

# ... and both per IPv6 /48 (four /64s' worth)
[[ratelimits]]
name = "RANK_POST_LIMIT48"
namespace_id = "7307"
simple = { limit = 24, period = 60 }

[[ratelimits]]
name = "RANK_READ_LIMIT48"
namespace_id = "7308"
simple = { limit = 240, period = 60 }

[vars]
ALLOWED_ORIGINS = "https://github30.github.io,http://localhost:5173,http://localhost:4173,http://127.0.0.1:5173,http://127.0.0.1:4173"

[observability]
enabled = true
